name: release

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for npm publish https://docs.npmjs.com/trusted-publishers
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          install: true
          cache: false # don’t risk a bad publish from bad cache
          runtime: node@26
      - run: pnpm run build
      - uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm exec changeset publish
          commit-message: "[ci] release"
          pr-title: "[ci] release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
