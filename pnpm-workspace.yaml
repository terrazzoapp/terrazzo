packages:
  - packages/**
  - www
  - '!packages/**/test/**'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true

catalog:
  '@humanwhocodes/momoa': ^3.3.13
  '@types/node': ^25.9.9
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@typescript/typescript6': '^6.0.2'
  '@vitejs/plugin-react': ^5.2.0
  '@vitest/browser': ^5.0.4
  '@vitest/browser-playwright': ^5.0.4
  '@vitest/coverage-v8': ^5.0.4
  colorjs.io: ^0.7.1
  dtcg-examples: ^1.1.3
  oxfmt: ^0.57.0
  oxlint: ^1.87.0
  playwright: ^1.64.0
  react: ^19.3.0
  react-dom: ^19.3.0
  vite: ^8.3.4
  vite-plugin-dts: ^5.1.2
  vitest: ^5.0.4
  yaml-to-momoa: 0.1.0

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4
  - '@vitest/browser-playwright@5.0.4'
  - '@vitest/browser@5.0.4'
  - '@vitest/coverage-v8@5.0.4'
  - '@vitest/pretty-format@5.0.4'
  - '@vitest/ui@5.0.4'
  - '@vitest/utils@5.0.4'

onlyBuiltDependencies:
  - esbuild
  - sharp

shellEmulator: true
