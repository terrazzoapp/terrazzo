<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTerrazzo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F11"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#0F0F11"/>
    </linearGradient>
    <linearGradient id="accentTerrazzo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="25%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cardGradTerrazzo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#121216" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgTerrazzo)"/>

  <!-- Design Token Color Palette Swatches Background -->
  <g opacity="0.15">
    <rect x="100" y="80" width="160" height="120" rx="16" fill="#8B5CF6"/>
    <rect x="280" y="80" width="160" height="120" rx="16" fill="#EC4899"/>
    <rect x="460" y="80" width="160" height="120" rx="16" fill="#F59E0B"/>
    <rect x="640" y="80" width="160" height="120" rx="16" fill="#10B981"/>
    <rect x="820" y="80" width="160" height="120" rx="16" fill="#3B82F6"/>
  </g>

  <!-- Main Title Card -->
  <rect x="150" y="160" width="900" height="355" rx="16" fill="url(#cardGradTerrazzo)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="2"/>
  <rect x="150" y="160" width="900" height="6" fill="url(#accentTerrazzo)"/>

  <!-- Badge Icon -->
  <rect x="200" y="210" width="64" height="64" rx="12" fill="url(#accentTerrazzo)"/>
  <text x="232" y="254" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle">TZ</text>

  <text x="285" y="242" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#F8FAFC" letter-spacing="2">TERRAZZO</text>
  <text x="285" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#F472B6">DTCG Design Tokens CLI &amp; Monorepo Compiler Framework</text>

  <line x1="200" y1="305" x2="1000" y2="305" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Tech Pill Badges -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">
    <rect x="200" y="330" width="130" height="36" rx="18" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="265" y="353" fill="#DBEAFE" text-anchor="middle">TypeScript</text>

    <rect x="345" y="330" width="140" height="36" rx="18" fill="#581C87" stroke="#A855F7" stroke-width="1.5"/>
    <text x="415" y="353" fill="#F3E8FF" text-anchor="middle">DTCG Tokens</text>

    <rect x="495" y="330" width="140" height="36" rx="18" fill="#7C2D12" stroke="#F97316" stroke-width="1.5"/>
    <text x="565" y="353" fill="#FFEDD5" text-anchor="middle">pnpm Monorepo</text>

    <rect x="645" y="330" width="130" height="36" rx="18" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="710" y="353" fill="#D1FAE5" text-anchor="middle">Turborepo</text>
  </g>

  <text x="200" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#E4E4E7">
    Generate CSS, Sass, JS/TS, Swift, and Tailwind code directly from DTCG design tokens.
  </text>
  <text x="200" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#A1A1AA">
    Milestones 2 &amp; 3 Verification • Genuine Code Analysis • Complete System Integrity
  </text>

  <text x="600" y="620" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#71717A" text-anchor="middle">Terrazzo Monorepo • Design System Tooling</text>
</svg>
